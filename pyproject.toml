[project]
name = "dsp-scraper"
version = "0.1.0"
description = "Find a Bandcamp release on other DSPs by scraping, output as JSON"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "playwright>=1.62.0",
    "rapidfuzz>=3.14.5",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsp_scraper"]
